name: Walker Flutter Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, feat/no-payment-booking]
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-ci.yml"
      - "docs/**"
      - "scripts/**"
      - "DOJO PARTNER.png"
  pull_request:
    branches: [main, feat/no-payment-booking]
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-ci.yml"
      - "docs/**"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'

      - name: Set up Python for launcher icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate DOJO PARTNER Android launcher icons
        run: |
          python -m pip install --upgrade pip Pillow
          python scripts/generate_android_launcher_icons.py --logo "DOJO PARTNER.png" --label "DOJO PARTNER" --background "#174A78"

      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings_candidates = [Path("android/settings.gradle.kts"), Path("android/settings.gradle")]
          app_candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          settings = next((p for p in settings_candidates if p.exists()), None)
          app = next((p for p in app_candidates if p.exists()), None)
          if settings is None or app is None:
              raise SystemExit("Flutter Android Gradle files were not generated.")

          settings_text = settings.read_text()
          if "com.google.gms.google-services" not in settings_text:
              line = ('    id("com.google.gms.google-services") version "4.4.2" apply false\n'
                      if settings.suffix == ".kts" else
                      "    id 'com.google.gms.google-services' version '4.4.2' apply false\n")
              marker = "plugins {"
              if marker not in settings_text:
                  raise SystemExit("Could not find Gradle plugins block in settings file.")
              settings_text = settings_text.replace(marker, marker + "\n" + line.rstrip(), 1)
              settings.write_text(settings_text)

          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              line = ('    id("com.google.gms.google-services")\n'
                      if app.suffix == ".kts" else
                      "    id 'com.google.gms.google-services'\n")
              marker = "plugins {"
              if marker not in app_text:
                  raise SystemExit("Could not find Gradle plugins block in app file.")
              app_text = app_text.replace(marker, marker + "\n" + line.rstrip(), 1)
              app.write_text(app_text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build single universal Android release APK
        run: flutter build apk --release

      - name: Report APK signing certificate fingerprints (public only)
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ ! -f "$APK" ]]; then
            echo "::error::Built APK was not found at $APK"
            exit 1
          fi
          if [[ -z "$SDK" || ! -d "$SDK/build-tools" ]]; then
            echo "::error::Android SDK build-tools directory was not found."
            exit 1
          fi
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found in Android SDK build-tools."
            exit 1
          fi
          echo "Reading the signing certificate directly from the APK built in this job."
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          if ! grep -qE 'certificate SHA-1 digest:' <<<"$CERT_OUTPUT"; then
            echo "::error::APK signing certificate SHA-1 fingerprint was not reported."
            exit 1
          fi
          if ! grep -qE 'certificate SHA-256 digest:' <<<"$CERT_OUTPUT"; then
            echo "::error::APK signing certificate SHA-256 fingerprint was not reported."
            exit 1
          fi

      - name: Upload single Partner APK
        uses: actions/upload-artifact@v4
        with:
          name: dojo-walk-walker-release-apks
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
